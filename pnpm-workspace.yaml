packages:
  - '.'
# Project-wide settings
overrides:
  # Security fixes for transitive dependencies (Node 22 compatible)
  # next pins postcss@8.4.31
  postcss: ^8.5.23
allowBuilds:
  sharp: true
  unrs-resolver: true
  # install script only builds from source when explicitly requested; prebuilt binaries are used
  '@parcel/watcher': false
minimumReleaseAge: 10080  # 7 days in minutes
